name: PrimePulse Telegram Outreach

on:
  workflow_dispatch:
  schedule:
    - cron: "7 */2 * * *"

jobs:
  telegram-outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests telethon

      - name: Run Telegram outreach dispatcher
        env:
          WP_BASE: https://cryptalysts.com
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          MAX_TELEGRAM_SENDS: 3
          OUTREACH_PRIORITY: HIGH
          SLEEP_BETWEEN_SENDS: 35
        run: python telegram_outreach_dispatcher.py
