name: Cryptalysts Public Telegram Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "13 * * * *"

jobs:
  public-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow
      - name: Run public Telegram feed
        env:
          WP_BASE: https://cryptalysts.com
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PUBLIC_CHANNEL_ID: ${{ secrets.PUBLIC_CHANNEL_ID }}
          MAX_PUBLIC_FEED_POSTS: 2
          PROMO_EVERY_RUN: true
        run: python telegram_public_feed.py
