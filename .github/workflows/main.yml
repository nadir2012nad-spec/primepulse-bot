name: PrimePulse Discovery Engine

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run PrimePulse Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          WP_USERNAME: ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}

          MIN_LIQUIDITY_USD: ${{ vars.MIN_LIQUIDITY_USD }}
          MAX_AGE_MINUTES: ${{ vars.MAX_AGE_MINUTES }}
          REQUIRE_SOCIAL: ${{ vars.REQUIRE_SOCIAL }}
          RUN_ONCE: "true"

        run: |
          python primepulse_bot.py
